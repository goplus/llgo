name: "Setup GoReleaser"
description: "Setup GoReleaser environment"
inputs:
  esp-clang-cache-path:
    description: "ESP Clang cache path (internal use)"
    required: false
    default: |
      .sysroot/darwin/amd64/crosscompile/clang
      .sysroot/darwin/arm64/crosscompile/clang
      .sysroot/linux/amd64/crosscompile/clang
      .sysroot/linux/arm64/crosscompile/clang
runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: ./.github/actions/setup-go
    - name: Populate Linux sysroot
      run: tar -xzvf .sysroot/linux.tar.gz -C .sysroot
      shell: bash
    - name: Cache ESP Clang
      id: cache-esp-clang
      uses: actions/cache@v6
      with:
        path: ${{ inputs.esp-clang-cache-path }}
        key: esp-clang-${{ hashFiles('.github/workflows/download_esp_clang.sh') }}
    - name: Download ESP Clang (if cache miss)
      if: steps.cache-esp-clang.outputs.cache-hit != 'true'
      run: bash .github/workflows/download_esp_clang.sh
      shell: bash
    - name: Cache Darwin LLD
      id: cache-darwin-lld
      uses: actions/cache@v6
      with:
        path: |
          .sysroot/darwin/amd64/libexec
          .sysroot/darwin/arm64/libexec
        key: darwin-lld-${{ hashFiles('.github/lld/*', '.github/workflows/download_darwin_lld.sh') }}
    - name: Download pinned SDK-compatible Darwin LLD
      if: steps.cache-darwin-lld.outputs.cache-hit != 'true'
      run: bash .github/workflows/download_darwin_lld.sh
      shell: bash
    - name: Prepare the shared Unix archive layout
      run: mkdir -p .sysroot/linux/{amd64,arm64}/libexec/llgo
      shell: bash
    - name: Check file
      run: tree .sysroot
      shell: bash
